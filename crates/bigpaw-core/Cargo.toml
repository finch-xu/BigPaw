[package]
name = "bigpaw-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
mdns-sd = "0.13"
tokio = { version = "1", features = ["sync"] }
gethostname = "1"
zeroize = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
